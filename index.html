      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 460px;
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111;
      margin-bottom: 8px;
    }
    .phase-badge {
      display: inline-block;
      background: #111;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    /* 進捗バー */
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    /* メインコンテナ */
    #quiz-view {
      width: 100%;
      max-width: 460px;
    }
    .instruction {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* 4択グリッド (2x2) */
    .grid-choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .choice-card {
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      cursor: pointer;
      text-align: center;
      border: 3px solid transparent;
      transition: border-color 0.15s ease, transform 0.08s ease;
      user-select: none;
    }
    .choice-card:active {
      transform: scale(0.97);
    }
    .choice-card.selected {
      border-color: #ff4d6d;
      background: #fff5f7;
    }
    .img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
    }
    .choice-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .combi {
      font-size: 0.7rem;
      color: #777;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name {
      font-size: 0.88rem;
      font-weight: bold;
      color: #111;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ボタンエリア */
    .action-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 13px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 26px;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: opacity 0.15s ease;
    }
    .btn:active { opacity: 0.85; }
    .btn-next { background: #ff4d6d; color: #fff; }
    .btn-skip { background: #e9ecef; color: #555; }

    /* 結果画面 */
    #result-view {
      display: none;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .capture-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .capture-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      color: #111;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .grid-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      color: #fff;
      font-size: 0.7rem;
      line-height: 1.2;
      padding: 12px 2px 4px 2px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-tag {
      font-weight: 800;
      color: #ffd166;
      margin-right: 2px;
    }
    .btn-save {
      background: #111;
      color: #fff;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

      { combi: "グゴゴ0.9", name: "友人", img: "yuujin.jpg" },

      { combi: "ピン", name: "清川雄司", img: "kiyokawa.jpg" },
      { combi: "ピン", name: "岡田浩太朗", img: "okada.jpg" }
    ];

    let currentPhase = "preliminary"; // "preliminary" or "main"
    let prelimGroups = [];
    let prelimIndex = 0;
    let selectedIndices = new Set();
    let prelimSelectedPeople = [];
    let prelimRejectedPeople = [];

    // 本戦用ステート
    let final36 = [];
    let mainQuestions = [];
    let mainQIndex = 0;
    let scores = {};

    function init() {
      // 100名をシャッフルして4人×25組に分ける
      const shuffled = [...rawCandidates].sort(() => Math.random() - 0.5);
      prelimGroups = [];
      for (let i = 0; i < shuffled.length; i += 4) {
        prelimGroups.push(shuffled.slice(i, i + 4));
      }
      prelimIndex = 0;
      prelimSelectedPeople = [];
      prelimRejectedPeople = [];
      showPrelimQuestion();
    }

    // --- 予選（100名 → 36名） ---
    function showPrelimQuestion() {
      selectedIndices.clear();
      const group = prelimGroups[prelimIndex];

      const processedCount = prelimIndex * 4;
      document.getElementById('phase-badge').innerText = "予選（100名 → 36名選出）";
      document.getElementById('progress-text').innerText = `組 ${prelimIndex + 1} / ${prelimGroups.length}`;
      document.getElementById('settled-text').innerText = `${processedCount} / 100人`;
      document.getElementById('progress-fill').style.width = `${(processedCount / 100) * 100}%`;
      document.getElementById('instruction-text').innerText = "気になる顔を最大2人まで選んでください（0人でも可）";

      renderCards(group, 2);
    }

    function renderCards(members, maxPick) {
      const container = document.getElementById('choices-container');
      container.innerHTML = '';

      members.forEach((m, idx) => {
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.id = `card-${idx}`;
        
        const fallbackSrc = `https://placehold.jp/300x300.png?text=${encodeURIComponent(m.name)}`;
        card.innerHTML = `
          <div class="img-wrap">
            <img src="${m.img}" onerror="this.src='${fallbackSrc}'" crossorigin="anonymous">
          </div>
          <div class="combi">${m.combi}</div>
          <div class="name">${m.name}</div>
        `;

        card.onclick = () => toggleSelect(idx, maxPick);
        container.appendChild(card);
      });
    }

    function toggleSelect(idx, maxPick) {
      if (maxPick === 1) {
        // 本戦（1人のみ即時選択）
        selectedIndices.clear();
        selectedIndices.add(idx);
        document.querySelectorAll('.choice-card').forEach((c, i) => {
          c.classList.toggle('selected', i === idx);
        });
        submitSelection(false);
        return;
      }

      // 予選（最大2人選択）
      if (selectedIndices.has(idx)) {
        selectedIndices.delete(idx);
      } else {
        if (selectedIndices.size >= maxPick) return;
        selectedIndices.add(idx);
      }

      document.querySelectorAll('.choice-card').forEach((c, i) => {
        c.classList.toggle('selected', selectedIndices.has(i));
      });
    }

    function submitSelection(isSkip) {
      if (currentPhase === "preliminary") {
        const group = prelimGroups[prelimIndex];
        if (isSkip) {
          prelimRejectedPeople.push(...group);
        } else {
          group.forEach((m, idx) => {
            if (selectedIndices.has(idx)) {
              prelimSelectedPeople.push(m);
            } else {
              prelimRejectedPeople.push(m);
            }
          });
        }

        prelimIndex++;
        if (prelimIndex < prelimGroups.length) {
          showPrelimQuestion();
        } else {
          finalizePrelim();
        }
      } else {
        // 本戦
        if (selectedIndices.size === 0) return;
        const pickedIdx = [...selectedIndices][0];
        const winner = mainQuestions[mainQIndex][pickedIdx];
        scores[winner.name] = (scores[winner.name] || 0) + 1;

        mainQIndex++;
        if (mainQIndex < mainQuestions.length) {
          showMainQuestion();
        } else {
          finishMain();
        }
      }
    }

    // 予選終了時：過不足を調整して正確に36名にする
    function finalizePrelim() {
      if (prelimSelectedPeople.length >= 36) {
        final36 = prelimSelectedPeople.slice(0, 36);
      } else {
        const needed = 36 - prelimSelectedPeople.length;
        const fill = prelimRejectedPeople.sort(() => Math.random() - 0.5).slice(0, needed);
        final36 = [...prelimSelectedPeople, ...fill];
      }
      startMainPhase();
    }

    // --- 本戦（36名 → 4択1人選択で9位まで決定） ---
    function startMainPhase() {
      currentPhase = "main";
      document.getElementById('phase-badge').innerText = "本戦（36名 → 好き顔9選決定）";
      document.getElementById('instruction-text').innerText = "一番好きな顔を1人選んでください";
      document.getElementById('btn-skip').style.display = 'none'; // 本戦はスキップなし
      document.getElementById('btn-next').style.display = 'none'; // カードタップで即決定

      // 36名それぞれにスコア初期化
      scores = {};
      final36.forEach(m => { scores[m.name] = 0; });

      // 4人ずつ均等に比較されるよう、シャッフルしたグループ対戦を複数ラウンド組む
      mainQuestions = [];
      const rounds = 3; // 各メンバーが複数回4択に登場し正確に順位付け
      for (let r = 0; r < rounds; r++) {
        const pool = [...final36].sort(() => Math.random() - 0.5);
        for (let i = 0; i < pool.length; i += 4) {
          mainQuestions.push(pool.slice(i, i + 4));
        }
      }
      mainQIndex = 0;
      showMainQuestion();
    }

    function showMainQuestion() {
      selectedIndices.clear();
      const group = mainQuestions[mainQIndex];

      const pct = Math.round((mainQIndex / mainQuestions.length) * 100);
      document.getElementById('progress-text').innerText = `本戦: ${mainQIndex + 1} / ${mainQuestions.length} 問`;
      document.getElementById('settled-text').innerText = `${pct}% 完了`;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      renderCards(group, 1);
    }

    function finishMain() {
      document.getElementById('progress-text').innerText = "ソート完了！";
      document.getElementById('settled-text').innerText = "100% 完了";
      document.getElementById('progress-fill').style.width = "100%";

      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      // スコアの高い順にソート（同点はランダム）
      const sorted = [...final36].sort((a, b) => {
        const scoreDiff = (scores[b.name] || 0) - (scores[a.name] || 0);
        return scoreDiff !== 0 ? scoreDiff : Math.random() - 0.5;
      });

      const top9 = sorted.slice(0, 9);
      const grid = document.getElementById('result-grid');
      grid.innerHTML = '';

      top9.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'grid-item';
        const fallbackSrc = `https://placehold.jp/300x300.png?text=${encodeURIComponent(item.name)}`;
        itemEl.innerHTML = `
          <img src="${item.img}" onerror="this.src='${fallbackSrc}'" crossorigin="anonymous">
          <div class="grid-label">
            <span class="rank-tag">${idx + 1}位</span>${item.name}
          </div>
        `;
        grid.appendChild(itemEl);
      });
    }

    function saveImage() {
      const target = document.getElementById('capture-area');
      html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'my-best9.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }

    init();
  </script>
</body>
</html>
